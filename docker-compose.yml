name: go-vue-starter

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/app?sslmode=disable}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # No fallback here on purpose: production must set a real JWT_SECRET in
      # .env. An empty value makes the Go config loader's length check fail
      # startup instead of silently signing sessions with a known secret.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env before running the production compose}
      JWT_ISSUER: ${JWT_ISSUER:-go-vue-starter}
      JWT_TTL: ${JWT_TTL:-24h}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:-}
      SSO_ISSUER: ${SSO_ISSUER:-https://sso.gloscai.com}
      SSO_SCOPES: ${SSO_SCOPES:-user:read}
      SSO_POST_LOGIN_PATH: ${SSO_POST_LOGIN_PATH:-/profile}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
