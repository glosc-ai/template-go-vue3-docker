name: go-vue-starter-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./server
      target: development
    command: go run .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DB_DRIVER: postgres
      DATABASE_URL: postgres://app:app@postgres:5432/app?sslmode=disable
      AUTO_MIGRATE: "true"
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-before-release}
      JWT_ISSUER: go-vue-starter
      JWT_TTL: 24h
    volumes:
      - ./server:/app
      - go_modules:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    build:
      context: ./web
      target: development
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"

volumes:
  postgres_dev_data:
  redis_dev_data:
  go_modules:
  go_build_cache:
  web_node_modules:
